<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>画像生成</title>
  <style>
    body {
      margin: 0;
      background: #0f1020;
      color: #fff;
      font-family: sans-serif;
    }

    header {
      padding: 15px 20px;
      background: #1b1630;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header button {
      background: none;
      border: 1px solid #fff;
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
    }

    .main {
      display: flex;
      height: calc(100vh - 60px);
    }

    .tools {
      width: 220px;
      background: #15152a;
      padding: 15px;
      box-sizing: border-box;
    }

    .tools h3 {
      margin-top: 0;
    }

    .tools label {
      font-size: 12px;
      opacity: 0.8;
      display: block;
      margin-top: 10px;
    }

    .tools input[type="range"] {
      width: 100%;
    }

    .canvas-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #202040;
    }

    canvas {
      background: #fff;
      border-radius: 8px;
      cursor: crosshair;
    }

    .right {
      width: 320px;
      background: #15152a;
      padding: 15px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .right h3 {
      margin-top: 0;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      border-radius: 8px;
      border: none;
      padding: 8px;
      resize: vertical;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .right button {
      width: 100%;
      padding: 12px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      margin-top: 5px;
    }

    .preview {
      margin-top: 10px;
      flex: 1;
      overflow: auto;
    }

    .preview img {
      width: 100%;
      border-radius: 8px;
      margin-top: 10px;
      background: #333;
    }

    .small {
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

<header>
  <div>Sketch Canvas</div>
  <button onclick="location.href='index.html'">← ホームに戻る</button>
</header>

<div class="main">
  <!-- 左：ツール -->
  <div class="tools">
    <h3>ツール</h3>
    <label>ペン太さ</label>
    <input type="range" id="size" min="1" max="10" value="2">

    <label>色</label>
    <input type="color" id="color" value="#000000">

    <button onclick="clearCanvas()">クリア</button>
  </div>

  <!-- 中央：キャンバス -->
  <div class="canvas-area">
    <canvas id="canvas" width="512" height="512"></canvas>
  </div>

  <!-- 右：生成 -->
  <div class="right">
    <h3>イメージ指定</h3>
    <textarea id="prompt" placeholder="例：gothic lolita dress, black and white, lace, corset, frills..."></textarea>
    <div class="small">※ 英語プロンプト推奨（後で自動翻訳対応も可）</div>

    <button onclick="generate()">画像を生成</button>

    <div class="preview" id="preview"></div>
  </div>
</div>

<script>
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  let drawing = false;

  canvas.addEventListener("mousedown", () => drawing = true);
  canvas.addEventListener("mouseup", () => {
    drawing = false;
    ctx.beginPath();
  });
  canvas.addEventListener("mouseleave", () => {
    drawing = false;
    ctx.beginPath();
  });
  canvas.addEventListener("mousemove", draw);

  function draw(e) {
    if (!drawing) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    ctx.strokeStyle = document.getElementById("color").value;
    ctx.lineWidth = document.getElementById("size").value;
    ctx.lineCap = "round";

    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  }

  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.beginPath();
  }

  function generate() {
    const preview = document.getElementById("preview");
    const prompt = document.getElementById("prompt").value;

    // ① キャンバスを画像として取得（base64）
    const sketchBase64 = canvas.toDataURL("image/png");

    console.log("プロンプト:", prompt);
    console.log("スケッチ(base64):", sketchBase64.slice(0, 100) + "...");

    preview.innerHTML = "<p>生成中...</p>";

    // ② 仮の生成結果（あとでAI出力に差し替え）
    setTimeout(() => {
      preview.innerHTML = `
        <p>生成結果（ダミー）</p>
        <img src="https://placehold.co/512x512?text=Generated+Image">
      `;
    }, 1200);
  }
</script>

</body>
</html>
